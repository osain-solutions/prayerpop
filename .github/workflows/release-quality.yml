name: Release quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript-syntax:
    name: JavaScript syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: find . -path './node_modules' -prune -o -path './vendor' -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: wordpress/plugin-check-action@98a1788320d0add90df2d8183934ecccbc4e05d2
        with:
          build-dir: "."
          slug: "prayerpop"
          categories: |
            general
            plugin_repo
            security
            performance

  compatibility:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - php: '7.2'
          - php: '8.2'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: find . -path './vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

  browser-smoke:
    name: WordPress activation smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx wp-env start
      - run: npx wp-env run cli wp plugin activate prayerpop
